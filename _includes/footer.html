<footer class="foot">
  <a href="{{ site.github.url }}/">Eadwyn</a>
  <div class="links">
    <a href="{{ site.github.url }}/about">About</a>
    <a href="{{ site.github.url }}/contact">Contact</a>
    {% for item in site.data.settings.social %}
      <a href="{% include href.html u=item.link %}"{% unless item.link contains 'mailto:' or item.link contains '.xml' %} target="_blank" rel="noopener"{% endunless %}>{{ item.name }}</a>
    {% endfor %}
  </div>
</footer>

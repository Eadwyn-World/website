<footer class="footer">
  <div class="footer-nav">
    <a href="{{ site.github.url }}/">Home</a>
    <a href="{{ site.github.url }}/about">About</a>
    <a href="{{ site.github.url }}/contact">Contact</a>
  </div>
  {% for item in site.data.settings.social %}
    <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
  {% endfor %}
  <div class="footer-description"><a href="{{ site.github.url }}/">{{ site.title }} — {{ site.description }}</a></div>
</footer>

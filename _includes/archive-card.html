<a class="archive-card" href="{{ site.github.url }}{{ post.url }}">
  {% if post.image %}
    <div class="archive-card-image" style="background-image:url('{{ site.github.url }}/assets/img/{{ post.image }}')"></div>
  {% endif %}
  <div class="archive-card-body">
    {% if post.categories %}<span class="archive-card-tag">{{ post.categories | first }}</span>{% endif %}
    <h2>{{ post.title }}</h2>
    <p class="archive-card-excerpt">{{ post.excerpt | strip_html | truncatewords: 22 }}</p>
  </div>
</a>

<nav class="nav" aria-label="Primary">
  <a class="nav-brand" href="{{ site.github.url }}/">EADWYN</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
  <div class="nav-links" id="nav-links">
    {% for item in site.data.settings.menu %}
      {% assign item_url = '/' | append: item.url %}
      <a href="{{ site.github.url }}{{ item_url }}"{% if page.url == item_url or page.nav == item.name %} class="on" aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
    {% for item in site.data.settings.rail %}
      <a class="mobile-only" href="{{ site.github.url }}/{{ item.url }}">{{ item.name }}</a>
    {% endfor %}
  </div>
</nav>

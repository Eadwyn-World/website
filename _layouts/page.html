---
layout: default
---

{% if page.hero_image %}
<section class="page-hero img" style="background-image:url('{{ site.github.url }}/assets/img/{{ page.hero_image }}')">
  <div class="fade"></div>
{% else %}
<section class="page-hero plain">
  <svg class="deco" style="right:-120px;top:-60px;width:620px;height:400px;color:#123527;transform:rotate(-160deg) scaleX(-1)" aria-hidden="true"><use href="#frond" width="620" height="400"></use></svg>
{% endif %}
  <svg class="deco drift" style="inset:0;width:100%;height:100%;color:rgba(94,231,222,.6)" aria-hidden="true"><use href="#spores" width="1440" height="700"></use></svg>
  <div class="copy wrap">
    {% if page.eyebrow %}<span class="eb eb-teal">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>

<article class="prose wrap">
  {{ content }}
</article>

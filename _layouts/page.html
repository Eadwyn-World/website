---
layout: default
---

<div class="page-hero">
  <div class="page-hero-inner">
    {% if page.eyebrow %}<span class="hero-eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="page-content">
  <article>
    {{ content }}
  </article>
</div>
